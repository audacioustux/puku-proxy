name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The deploy builds this Dockerfile from source on every Dokploy push,
      # so a broken Dockerfile is a broken deploy. Build it here to catch that
      # before it reaches the host.
      - name: Build image
        run: docker build --build-arg CACHEBUST=ci-${{ github.sha }} -t puku-proxy:ci .
